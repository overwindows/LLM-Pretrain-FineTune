$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: qwen35-mai-profile-smoke
experiment_name: LLM-Fine-Tuning
description: Verify the AML and AgentX metric flow using synthetic predictions.
code: .
compute: azureml:/subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/rg-cs-ranking-ml-singularity/providers/Microsoft.MachineLearningServices/virtualClusters/ranking
environment: azureml:torch251-cuda124-deepspeed-flashattn-training:7
inputs:
  checkpoint: checkpoint-3000
outputs:
  metrics:
    type: uri_folder
    mode: rw_mount
environment_variables:
  WANDB_MODE: disabled
  _AZUREML_SINGULARITY_JOB_UAI: /subscriptions/b6dc87f3-c479-49c8-8cb5-7896da3ff895/resourceGroups/AMLStudio/providers/Microsoft.ManagedIdentity/userAssignedIdentities/rankfun_aml
resources:
  instance_count: 1
  instance_type: Singularity.ND12am_A100_v4
  shm_size: 2g
  properties:
    AISuperComputer:
      enableAzmlInt: false
      locations: [ukwest]
      priority: High
      slaTier: Premium
limits:
  timeout: 900
command: >-
  /opt/conda/envs/ptca/bin/python smoke_score.py
  "${{inputs.checkpoint}}" "${{outputs.metrics}}"
