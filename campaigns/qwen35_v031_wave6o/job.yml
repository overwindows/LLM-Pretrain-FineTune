command: >-
  bash -c "
  export PARAM_SPEC_TOKENS=${{inputs.spec_tokens}} &&
  export PARAM_MAX_NUM_SEQS=${{inputs.max_num_seqs}} &&
  export PARAM_MAX_NUM_BATCHED_TOKENS=${{inputs.max_num_batched_tokens}} &&
  export PARAM_TEMPERATURE=${{inputs.temperature}} &&
  export PARAM_TOP_P=${{inputs.top_p}} &&
  export PARAM_D2G_STAGES=${{inputs.d2g_stages}} &&
  export PARAM_D2G_TILE=${{inputs.d2g_tile}} &&
  export PARAM_D2G_WARPS=${{inputs.d2g_warps}} &&
  export PARAM_PROMPTS=${{inputs.prompts}} &&
  bash ./run_payload.sh
  "
